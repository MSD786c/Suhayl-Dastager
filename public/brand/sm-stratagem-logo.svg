<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1D3A"/>
      <stop offset="100%" stop-color="#071529"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#276BFF"/>
      <stop offset="100%" stop-color="#6E9CFF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(110, 156, 255, 0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="400" fill="url(#grid)"/>

  <!-- Logo Mark: Interlocking S + M geometric form -->
  <g transform="translate(180, 200)">
    <!-- SM monogram in two parts -->
    <!-- S curve -->
    <path d="M -50 -40 L 0 -40 Q 20 -40 20 -25 Q 20 -10 0 -10 L -20 -10 Q -40 -10 -40 5 Q -40 20 -20 20 L 0 20"
          fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- M form -->
    <path d="M 50 -40 L 50 40 M 50 -40 L 90 20 L 130 -40 L 130 40"
          fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(360, 200)">
    <text x="0" y="-20" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-0.04em">
      SM
    </text>
    <text x="0" y="40" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-0.04em">
      STRATAGEM
    </text>
    <text x="0" y="80" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" fill="#6E9CFF" letter-spacing="0.18em">
      DUBAI · DIGITAL PRODUCT STUDIO
    </text>
  </g>
</svg>
