<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1D3A"/>
      <stop offset="100%" stop-color="#071529"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#276BFF"/>
      <stop offset="100%" stop-color="#6E9CFF"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7F8FA"/>
      <stop offset="100%" stop-color="#A6ADB9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(110, 156, 255, 0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Document flow nodes -->
  <g transform="translate(400, 300)">

    <!-- Source: Zoho intake (left) -->
    <g transform="translate(-300, -50)">
      <rect x="-70" y="-50" width="140" height="100" rx="12" fill="#1A2540" stroke="#276BFF" stroke-width="1.5"/>
      <text x="0" y="-15" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="500" fill="#6E9CFF" letter-spacing="0.18em">SOURCE</text>
      <text x="0" y="10" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Zoho</text>
      <text x="0" y="32" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A6ADB9">Intake</text>
    </g>

    <!-- AI Engine: GPT-4 validation (center) -->
    <g transform="translate(0, 0)">
      <rect x="-90" y="-70" width="180" height="140" rx="14" fill="#1A2540" stroke="url(#flowGrad)" stroke-width="2"/>
      <text x="0" y="-40" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="500" fill="#6E9CFF" letter-spacing="0.18em">AI ENGINE</text>
      <text x="0" y="-10" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">GPT-4</text>
      <text x="0" y="14" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="14" font-weight="500" fill="#A6ADB9">Validate</text>
      <text x="0" y="36" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="14" font-weight="500" fill="#A6ADB9">Summarize</text>
      <text x="0" y="56" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="500" fill="#276BFF" letter-spacing="0.18em">RUBRIC v3</text>
    </g>

    <!-- Output: Twilio summary (right) -->
    <g transform="translate(300, -50)">
      <rect x="-70" y="-50" width="140" height="100" rx="12" fill="#1A2540" stroke="#276BFF" stroke-width="1.5"/>
      <text x="0" y="-15" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="500" fill="#6E9CFF" letter-spacing="0.18em">DELIVER</text>
      <text x="0" y="10" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Twilio</text>
      <text x="0" y="32" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="14" font-weight="400" fill="#A6ADB9">Summary</text>
    </g>

    <!-- Bottom: Audit log (PostgreSQL) -->
    <g transform="translate(0, 130)">
      <rect x="-90" y="-30" width="180" height="60" rx="10" fill="#0F1535" stroke="#6E9CFF" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="0" y="-5" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="500" fill="#6E9CFF" letter-spacing="0.18em">AUDIT LOG</text>
      <text x="0" y="15" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="13" font-weight="500" fill="#A6ADB9">PostgreSQL · ACL</text>
    </g>

    <!-- Flow lines -->
    <!-- Source to AI -->
    <path d="M -230 -50 L -90 0" stroke="url(#flowGrad)" stroke-width="2" fill="none" stroke-dasharray="6 4" opacity="0.8"/>
    <circle cx="-230" cy="-50" r="4" fill="#276BFF"/>
    <circle cx="-90" cy="0" r="4" fill="#276BFF"/>

    <!-- AI to Output -->
    <path d="M 90 0 L 230 -50" stroke="url(#flowGrad)" stroke-width="2" fill="none" stroke-dasharray="6 4" opacity="0.8"/>
    <circle cx="90" cy="0" r="4" fill="#276BFF"/>
    <circle cx="230" cy="-50" r="4" fill="#276BFF"/>

    <!-- AI down to Audit -->
    <path d="M 0 70 L 0 100" stroke="#6E9CFF" stroke-width="2" fill="none" stroke-dasharray="6 4" opacity="0.6"/>
    <circle cx="0" cy="70" r="4" fill="#6E9CFF"/>
    <circle cx="0" cy="100" r="4" fill="#6E9CFF"/>
  </g>

  <!-- Title at top -->
  <g transform="translate(400, 70)">
    <text x="0" y="0" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" fill="#6E9CFF" letter-spacing="0.22em">DOCUMENT-FLOW AUTOMATOR</text>
    <text x="0" y="36" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="-0.02em">AI-native onboarding pipeline</text>
  </g>

  <!-- Bottom metric -->
  <g transform="translate(400, 540)">
    <text x="0" y="0" text-anchor="middle" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="48" font-weight="800" fill="url(#flowGrad)" letter-spacing="-0.04em">40% faster</text>
    <text x="0" y="24" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="500" fill="#A6ADB9" letter-spacing="0.22em">REVIEW CYCLES · HALLIDAY FORFAITING</text>
  </g>
</svg>
